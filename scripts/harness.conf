# shellcheck shell=bash
# リポジトリ固有のハーネス設定。
# 共有スクリプト（scripts/lib/*.sh・フック・check-*.sh）はリポジトリ間で同一に保ち、
# リポジトリごとに異なる値はこのファイルだけに置く（依存性逆転：共有側は値の出どころを知らない）。

# PR 経由でのみ更新するブランチ
HARNESS_PROTECTED_BRANCHES='main|dev'

# Git 管理下に置いてはいけないパス（依存物・ビルド成果物）
HARNESS_FORBIDDEN_PATHS='(^|/)node_modules/|^target/|^packages/typescript/(dist|schema)/'

# エージェントに直接編集させないパス。"<glob>::<理由>" の形で並べる
HARNESS_FROZEN_PATHS=(
  'schema/*::生成物です。crates/modelith-plugin-protocol の型を変更し、UPDATE_GENERATED=1 cargo test -p modelith-plugin-protocol --test generated で再生成してください。'
  'packages/typescript/src/generated/*::生成物です。crates/modelith-plugin-protocol の型を変更し、UPDATE_GENERATED=1 cargo test -p modelith-plugin-protocol --test generated で再生成してください。'
  '*package-lock.json::lock ファイルは手で編集せず、npm コマンドで更新してください。'
  'Cargo.lock::lock ファイルは手で編集せず、cargo コマンドで更新してください。'
)

# この正規表現に合う変更があるとき、停止前に高速チェックを走らせる
HARNESS_VERIFY_TRIGGER='(\.(rs|ts|json|sh|bats|mjs)$|Cargo\.(toml|lock)$|^(scripts|schema|examples|tests)/|^\.claude/hooks/)'

# ブロック時に案内するドキュメント
HARNESS_STRATEGY_DOC='CLAUDE.md'

# 内容を同一に保つ相手リポジトリ（scripts/check-shared-sync.sh）
HARNESS_SHARED_WITH='modelith/modelith'
