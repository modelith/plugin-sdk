# shellcheck shell=bash
# リポジトリ固有のハーネス設定。
# 判断ロジック（scripts/lib/policy.sh）とフックは modelith と同じものを使い、
# リポジトリごとに異なる値はこのファイルだけに置く。

# PR 経由でのみ更新するブランチ
HARNESS_PROTECTED_BRANCHES='main|dev'

# Git 管理下に置いてはいけないパス（依存物・ビルド成果物）
HARNESS_FORBIDDEN_PATHS='(^|/)node_modules/|^target/|^packages/typescript/(dist|schema)/'

# この正規表現に合う変更があるとき、停止前に高速チェックを走らせる
HARNESS_VERIFY_TRIGGER='(\.(rs|ts|json|sh|bats|mjs)$|Cargo\.(toml|lock)$|^(scripts|schema|examples|tests)/|^\.claude/hooks/)'

# ブロック時に案内するドキュメント
HARNESS_STRATEGY_DOC='CLAUDE.md'
