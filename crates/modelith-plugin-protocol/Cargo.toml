[package]
name = "modelith-plugin-protocol"
description = "Contract between Modelith and its plugins: manifest, registry entry, rule set, edit and message types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# 生成物（JSON Schema・TS 型）を作るときだけ使う。既定では入れず、利用側の依存（とライセンス）を serde・serde_json だけにする。
codegen = ["dep:schemars", "dep:ts-rs"]

[dependencies]
schemars = { version = "1.2.2", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ts-rs = { version = "12.0.1", optional = true }

[dev-dependencies]
# 自身を codegen 付きで読み、`cargo test` だけで生成物の最新性（tests/generated.rs）を検証できるようにする。
modelith-plugin-protocol = { path = ".", features = ["codegen"] }

[lints]
workspace = true
